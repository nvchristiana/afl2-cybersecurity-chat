<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFL2 Cybersecurity - Secure Web Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    #login-card, #chat-container { background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 600px; }
    #chat-container { display: flex; flex-direction: column; height: 80vh; }
    
    h2 { margin-bottom: 16px; color: #38bdf8; font-size: 1.25rem; }
    input, button { padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; }
    button { background: #0284c7; cursor: pointer; font-weight: bold; border: none; }
    button:hover { background: #0369a1; }
    
    #messages { flex: 1; overflow-y: auto; padding: 12px; background: #0f172a; border-radius: 8px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    
    .msg-card { padding: 10px 14px; border-radius: 8px; background: #334155; max-width: 85%; word-wrap: break-word; }
    .msg-card.me { align-self: flex-end; background: #0369a1; }
    .msg-card.warning { background: #7f1d1d; border: 1px solid #ef4444; }
    .msg-card.secret { background: #581c87; border: 1px solid #a855f7; }
    
    .msg-header { font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
    .msg-body { font-size: 0.95rem; }
    
    .input-group { display: flex; gap: 8px; }
    .input-group input { flex: 1; }
    .hidden { display: none !important; }
    #user-list { font-size: 0.8rem; color: #38bdf8; margin-bottom: 12px; }
  </style>

  <!-- CDN Library Kriptografi Browser & Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
</head>
<body>

  <!-- Card Login -->
  <div id="login-card">
    <h2>🔒 AFL2 Cyber Security Chat App</h2>
    <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:12px;">Generating RSA Key Pair for Browser...</p>
    <div class="input-group">
      <input type="text" id="username-input" placeholder="Masukkan username..." />
      <button onclick="joinChat()">Join Chat</button>
    </div>
  </div>

  <!-- Container Chat -->
  <div id="chat-container" class="hidden">
    <h2 id="room-title">Chat Room</h2>
    <div id="user-list">Online Users: 0</div>
    <div id="messages"></div>

    <div class="input-group">
      <input type="text" id="message-input" placeholder="Ketik pesan atau perintah (!secret nama_user)..." onkeypress="handleKeyPress(event)" />
      <button onclick="sendMessage()">Kirim</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
